<html>

<head>
    <link rel="icon" type="image/x-icon" href="favicon.PNG">
    <script src="lib/babylon.js"></script>
    <script src="lib/babylon.gui.min.js" type="text/javascript"></script>
    <!-- opentype.js + earcut: needed to convert face-number digits from a
         stencil TTF into a triangulated, extrudable polygon for engraving
         on the mold flange. The stencil font is loaded asynchronously and
         exposed on window.stencilFont once ready. -->
    <script src="https://cdn.jsdelivr.net/npm/opentype.js@1.3.4/dist/opentype.min.js"></script>
    <script src="https://unpkg.com/earcut@2.2.4/dist/earcut.min.js"></script>
    <script>
        opentype.load('lib/stencil.ttf', (err, font) => {
            if (err) { console.error('Stencil font load failed:', err); return; }
            window.stencilFont = font;
            console.log('Stencil font loaded.');
        });
    </script>
    <!-- manifold-3d: robust WASM-based CSG. Async-loaded; once ready, the
         module is on window.manifold and a tiny smoke-test logs to verify.
         locateFile is required so the loader finds the .wasm next to the
         .js on the CDN (unpkg's rewrite breaks the default lookup). -->
    <script type="module">
        const BASE = 'https://unpkg.com/manifold-3d@2.5.1/';
        import(BASE + 'manifold.js').then(({ default: Module }) => {
            return Module({ locateFile: (path) => BASE + path });
        }).then(m => {
            m.setup();
            window.manifold = m;
            try {
                const a = m.Manifold.cube([10, 10, 10], true);
                const b = m.Manifold.sphere(6, 32);
                const r = a.subtract(b);
                const out = r.getMesh();
                console.log(`manifold-3d ready (smoke test: ${out.triVerts.length / 3} tris).`);
                a.delete(); b.delete(); r.delete();
            } catch (e) {
                console.error("manifold-3d smoke test failed:", e);
            }
        }).catch(e => console.error("manifold-3d load failed:", e));
    </script>

                </div>

    </div>

    <div class="modal fade" id="noSelectionDialog">

                </div>
                <div class="modal-body" data-i18n="noSelectionMsg">Sélectionnez une face d'abord</div>

                </div>
            </div>

    </div>

    <div class="modal fade" id="cutterOptDialog">

                </div>

                    <div class="mb-2">
                        <label for="cutterMargin" class="col-form-label" data-i18n="marginField">Marge (cm):</label>

                    </div>

                        <label for="cutterHeight" class="col-form-label" data-i18n="heightField">Hauteur (cm):</label>
                        <input type="number" step="0.1" class="form-control" id="cutterHeight">
                    </div>
                    <div class="mb-2">
                        <label for="cutterThickness" class="col-form-label" data-i18n="thicknessField">Épaisseur (cm):</label>
                        <input type="number" step="0.01" class="form-control" id="cutterThickness">
                    </div>
                    <div class="mb-2">
                        <label for="cutterBaseWidth" class="col-form-label" data-i18n="baseWidthField">Largeur de base (cm):</label>
                        <input type="number" step="0.1" class="form-control" id="cutterBaseWidth">
                    </div>
                    <div class="mb-2">
                        <label for="cutterMoldWidth" class="col-form-label" data-i18n="moldWidthField">Largeur de base du moule (cm):</label>
                        <input type="number" step="0.1" class="form-control" id="cutterMoldWidth">
                    </div>
                    <div class="mb-2">
                        <label for="cutterMoldHeight" class="col-form-label" data-i18n="moldHeightField">Hauteur du moule (cm):</label>
                        <input type="number" step="0.05" class="form-control" id="cutterMoldHeight">
                    </div>
                    <div class="mb-2">
                        <label for="cutterTabRadius" class="col-form-label" data-i18n="tabRadiusField">Rayon onglet (cm):</label>
                        <input type="number" step="0.05" class="form-control" id="cutterTabRadius">
                    </div>
                    <div class="mb-2">
                        <label for="cutterAngle" class="col-form-label" data-i18n="angleField">Angle onglet (°):</label>
                        <input type="number" step="1" class="form-control" id="cutterAngle">
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal" data-i18n="cancelBtn">Annuler</button>
                    <button type="button" class="btn btn-primary" id="cutterOptOk" data-i18n="okBtn">OK</button>
                </div>
            </div>
        </div>
    </div>

    <div class="modal fade" id="importDialog">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h1 class="modal-title fs-5" id="exampleModalLabel">Importer un origami reçu par mail</h1>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <label for="importData" class="col-form-label">Entrez le contenu du mail:</label>
                    <input type="text" class="form-control" id="importData"
                        oninput="try{importName.value=JSON.parse(importData.value).name;} catch(e){}">
                    <label for="importName" class="col-form-label">Entrez le nom a enregistrer:</label>

                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Annuler</button>
                    <button type="button" class="btn btn-primary" id="importButton">Importer</button>
                </div>
            </div>

    </div>
